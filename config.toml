# atelier-studio 基建配置(重启级)。域根=src;全量形态:全部域 + 视频/日报双管线 +
# 网关(发布远程域)+ 监督器(bgutil + publish-engine 边车)+ 哨兵(默认阈值,见 atelier-core SentinelCfg)。

[paths]
journal_db = "data/hub/journal.db"
store_db   = "data/hub/store.db"
models_dir = "/home/Architecture/checkpoints"   # 复用现有权重(绝对路径)

[web]
enabled  = true
host     = "0.0.0.0"
port     = 8097
dist_dir = "frontend/dist"           # 前端子模块(Carnation/frontend 全功能)构建产物

[gateway]
enabled        = true                # publishers = 远程域,经 ws 由 publish-engine 实现
host           = "127.0.0.1"
port           = 8793
token          = ""
ack_timeout    = 1200.0              # 发布=浏览器自动化,留余量
remote_domains = ["publishers"]

[supervisor]

# bgutil POT 供给器(YouTube 采集防风控):node HTTP 服务,动态端口;需先在 server/ 子目录 npm ci && npx tsc
[[supervisor.children]]
name = "bgutil"
cmd  = ["node", "server/build/main.js", "--port", "{port}"]
cwd  = "src/services/bgutil-server"
dynamic_port = true

# 发布引擎(publishers 远程域实现):python 服务,自取网关地址接入
[[supervisor.children]]
name = "publish-engine"
cmd  = ["uv", "run", "python", "run.py"]
cwd  = "src/services/publish-engine"
env  = { BUS_GATEWAY_URL = "ws://127.0.0.1:8793", PUBLISH_ENGINE_PORT = "8803", PUBLISH_ENGINE_LOG_LEVEL = "INFO" }

# 注:监控源不限量(daemons_settings.max_channels 默认 0=无限);哨兵阈值走 atelier-core 默认(可加 [sentinel] 覆盖)。
