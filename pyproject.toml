[project]
name = "atelier-studio"
version = "0.1.0"
description = "Atelier 全量变体:视频翻译 + 新闻日报 + 全部域(监控/发布/媒体库/哨兵),全功能前端"
requires-python = "==3.11.*"
# 依赖动态聚合:各域自带 requirements.txt(依赖声明归域所有),变体只列"包含哪几张清单"。
# 引擎推理栈 = src/engines/requirements.txt;其余尚未归域项 = 本仓根 requirements.txt。
# 注:解析器旋钮(override/index/prerelease)不进清单,留 [tool.uv](uv 不从依赖继承)。
dynamic = ["dependencies"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
# 允许预发布 + 多源最佳匹配(解决 torchcodec)——与 Architecture 对齐
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = [
    "torchcodec==0.7.0",
    "triton==3.1.0",
    "torchvision==0.20.1",
    "librosa==0.11.0",
    "transformers==4.52.4",
    "tokenizers==0.21.4",
    "faster-whisper==1.2.1",
    "accelerate==1.13.0",
    "pyannote.audio==3.1.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy==1.26.4",
    "protobuf>=3.20.0",
    "soundfile==0.13.1",
    "opencv-python==4.13.0.92",
]

[tool.uv.sources]
atelier-core = { index = "forgejo" }   # 只 atelier-core 走内部 registry,其余照旧走 PyPI

# 内部包 registry(Forgejo PyPI);explicit=true → 仅被 sources 显式指名的包从此索引取,
# 不参与其他依赖的解析。认证走 ~/.netrc(machine debian.lan)。
[[tool.uv.index]]
name = "forgejo"
url = "http://debian.lan:3257/api/packages/Carnation/pypi/simple/"
explicit = true

[tool.uv.extra-build-dependencies]
whisperx = ["wheel", "setuptools"]
pyannote-audio = ["wheel", "setuptools"]

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

# 动态依赖聚合:各域自带 requirements.txt,变体在此列出包含哪几张(声明归域所有)。
# 后续 phase 增补 platform_adapters/publishers/pipeline 各自清单时,往 files 追加即可。
[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",                # 变体基座(atelier-core + 尚未归域项)
    "src/engines/requirements.txt",    # 引擎域:推理/模型栈
    "src/publishers/requirements.txt", # 发布域(进程域):浏览器自动化 + OCR 栈
    "src/pipelines/video/requirements.txt",  # video 管线:变化点检测(ruptures)
]

[tool.hatch.metadata]
allow-direct-references = true      # 允许 atelier-core @ git+… 及 whl/git 直接引用依赖

[tool.hatch.build.targets.wheel]
packages = ["src"]
