[project]
name = "atelier-studio"
version = "0.1.0"
description = "Atelier 全量变体:视频翻译 + 新闻日报 + 全部域(监控/发布/媒体库/哨兵),全功能前端"
requires-python = "==3.11.*"
dependencies = [
    # 平台内核(总线+存储枢纽+装配);变体域/管线经绝对导入 atelier_core.*
    "atelier-core>=0.1.0",              # Forgejo PyPI 包(见 [tool.uv.sources]);语义解析,不再钉 commit
    # ── 以下 = 本变体所含域/管线(engines + pipeline-video 闭包)的运行时依赖,
    #    对齐旧 Architecture 的 GPU 推理栈(CUDA 锁死;video 几乎需要整条栈)──────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "soundfile>=0.12.1",
    "opencv-python>=4.9.0",
    "ollama>=0.1.6",
    "rich>=13.0.0",
    "playwright>=1.60.0",
    # 核心算力底座(对齐 2.5.1 栈)
    "munch>=4.0.0",
    "json5>=0.9.0",
    "modelscope>=1.9.0",
    "descript-audiotools>=0.7.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    # Transformers 4.52.4 系列
    "transformers==4.52.4",
    "tokenizers==0.21.4",
    "accelerate==1.13.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.7.1",
    "librosa==0.11.0",
    # AmberNet 口语语种识别(lang_id.py)
    "nemo_toolkit[asr]",
    # IndexTTS-2.5 文本正则(infer_v2_5 的 nemo_tn)
    "nemo_text_processing",
    # ASR / 分离 / 说话人
    "whisperx @ git+https://github.com/m-bain/whisperX.git",
    "demucs>=4.0.1",
    "pyannote.audio==3.1.1",
    # 唱/说判别(singing_detect.py)
    "panns_inference",
    # 语义切分预测器(CPU 依存句法分析)+ spacy 各语模型
    "spacy>=3.7,<4.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
    "it-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "ru-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
    "ja-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_sm-3.8.0/ja_core_news_sm-3.8.0-py3-none-any.whl",
    "ko-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_sm-3.8.0/ko_core_news_sm-3.8.0-py3-none-any.whl",
    # OCR(封面文字检测)
    "paddlex>=3.5.2",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    # 封面文字擦除/编辑(FLUX 量化 + LoRA + Nunchaku)
    "bitsandbytes>=0.43.0",
    "gguf>=0.10.0",
    "peft>=0.15.0",
    "nunchaku @ https://github.com/nunchaku-ai/nunchaku/releases/download/v1.0.1/nunchaku-1.0.1+torch2.5-cp311-cp311-linux_x86_64.whl",
    # IndexTTS-2.5 及音频处理
    "conformer>=0.3.2",
    "diffusers>=0.29.0",
    "pyworld>=0.3.4",
    "x-transformers>=2.11.24",
    "wetext>=0.0.4",
    "WeTextProcessing>=1.0.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # 异步与系统 / 采集 / 分离
    "aiosqlite>=0.22.1",
    "yt-dlp>=2026.4.10",
    "httpx>=0.28.1",
    "myshell-openvoice @ git+https://github.com/myshell-ai/OpenVoice.git",
    "melotts @ git+https://github.com/myshell-ai/MeloTTS.git",
    "silero-vad>=5.1",
    "clearvoice",
    "yt-dlp-ejs>=0.8.0",
    "openai>=3.0.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
# 允许预发布 + 多源最佳匹配(解决 torchcodec)——与 Architecture 对齐
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = [
    "torchcodec==0.7.0",
    "triton==3.1.0",
    "torchvision==0.20.1",
    "librosa==0.11.0",
    "transformers==4.52.4",
    "tokenizers==0.21.4",
    "faster-whisper==1.2.1",
    "accelerate==1.13.0",
    "pyannote.audio==3.1.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy==1.26.4",
    "protobuf>=3.20.0",
    "soundfile==0.13.1",
    "opencv-python==4.13.0.92",
]

[tool.uv.sources]
atelier-core = { index = "forgejo" }   # 只 atelier-core 走内部 registry,其余照旧走 PyPI

# 内部包 registry(Forgejo PyPI);explicit=true → 仅被 sources 显式指名的包从此索引取,
# 不参与其他依赖的解析。认证走 ~/.netrc(machine debian.lan)。
[[tool.uv.index]]
name = "forgejo"
url = "http://debian.lan:3257/api/packages/Carnation/pypi/simple/"
explicit = true

[tool.uv.extra-build-dependencies]
whisperx = ["wheel", "setuptools"]
pyannote-audio = ["wheel", "setuptools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true      # 允许 atelier-core @ git+… 及 whl/git 直接引用依赖

[tool.hatch.build.targets.wheel]
packages = ["src"]
