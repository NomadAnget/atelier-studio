name: Constitution check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-constitution:
    name: Machine-verifiable constitution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out assembled domains
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          source_paths=()
          while read -r _ path; do
            if [[ "$path" =~ ^src/[^/]+$ ]]; then
              domain="${path#src/}"
              case "$domain" in
                core|boot|services|pipelines) continue ;;
              esac
              source_paths+=("$path")
            elif [[ "$path" =~ ^src/pipelines/[^/]+$ ]]; then
              source_paths+=("$path")
            fi
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

          if (( ${#source_paths[@]} == 0 )); then
            echo "::error::No domain or pipeline submodules found under src/"
            exit 1
          fi

          git -c url."https://x-access-token:${GH_SYNC_TOKEN}@github.com/".insteadOf="https://github.com/" \
            submodule update --init --depth 1 -- \
            "${source_paths[@]}"

      - name: Check out atelier-core
        uses: actions/checkout@v4
        with:
          repository: NomadAnget/atelier-core
          ref: master
          path: .github/atelier-core
          token: ${{ secrets.GH_SYNC_TOKEN }}
          persist-credentials: false

      - name: Verify assembled source checkouts
        run: |
          checked=0
          while read -r _ path; do
            if [[ "$path" =~ ^src/[^/]+$ ]]; then
              domain="${path#src/}"
              case "$domain" in
                core|boot|services|pipelines) continue ;;
              esac
              marker="${path}/header.py"
            elif [[ "$path" =~ ^src/pipelines/[^/]+$ ]]; then
              marker="${path}/plugin.py"
            else
              continue
            fi

            if [[ ! -f "$marker" ]]; then
              echo "::error::Missing ${marker}; source checkout is incomplete"
              exit 1
            fi
            checked=$((checked + 1))
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

          if (( checked == 0 )); then
            echo "::error::No domain or pipeline checkouts were verified"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install atelier-core
        run: python -m pip install .github/atelier-core

      - name: Check machine-verifiable constitution rules
        id: discipline
        continue-on-error: true
        run: python -m atelier_core.discipline src

      - name: Report constitution findings without blocking
        if: steps.discipline.outcome == 'failure'
        run: echo "::warning::The machine-constitution scan reported findings. Review the scanner output above; this advisory step does not block the workflow."

      - name: Check runtime assembly contracts
        run: python -m src.main --check
