name: Propose exact-SHA submodule updates

on:
  repository_dispatch:
    types: [submodule_commit]

permissions:
  contents: read

concurrency:
  group: submodule-pointer-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the parent repository
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Create or update parent pointer pull requests
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          if [[ -z "$GH_SYNC_TOKEN" ]]; then
            echo "::error::GH_SYNC_TOKEN is required to read child repositories and create parent pull requests"
            exit 1
          fi
          git config --global --add \
            "url.https://x-access-token:${GH_SYNC_TOKEN}@github.com/.insteadOf" \
            "https://github.com/"
          python3 .github/scripts/propose_submodule_updates.py
