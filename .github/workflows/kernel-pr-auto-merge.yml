name: Kernel check and auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [atelier-submodule-pr]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kernel-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  receive-submodule-pr:
    name: receive-submodule-pr
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - name: Create or update the variant integration PR
        env:
          ATELIER_CI_TOKEN: ${{ secrets.ATELIER_CI_TOKEN || secrets.GH_SYNC_TOKEN }}
          ATELIER_RELAY_MODE: intake
        run: python .github/scripts/submodule_pr_relay.py

  reconcile-marker:
    name: verify-reconcile-marker
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      skip_full: ${{ steps.verify.outputs.skip_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - name: Verify signed gitlink reconciliation marker
        id: verify
        env:
          ATELIER_CI_TOKEN: ${{ secrets.ATELIER_CI_TOKEN || secrets.GH_SYNC_TOKEN }}
          ATELIER_RELAY_MODE: verify
        run: python .github/scripts/submodule_pr_relay.py

  kernel-validation:
    name: kernel-validation
    needs: [reconcile-marker]
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && needs.reconcile-marker.outputs.skip_full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Upsert the scan report in the PR conversation and kernel-check summary.
    outputs:
      discipline_result: ${{ steps.discipline.outputs.result }}
      discipline_report_b64: ${{ steps.discipline.outputs.report_b64 }}
    permissions:
      contents: read
    steps:
      - name: Check out the PR merge result without submodules
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify the merge result matches this PR event
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"

      - name: Reject changes to trusted submodule URLs
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$EXPECTED_BASE_SHA" HEAD -- .gitmodules

      - name: Fetch private submodules with a step-scoped token
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          encoded_token="$(printf 'x-access-token:%s' "$GH_SYNC_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1           GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'           GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $encoded_token"             git submodule update --init --recursive

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Create a Python 3.11 environment
        run: uv venv --python 3.11 .venv

      - name: Install the kernel version pinned by this PR
        run: |
          KERNEL_SPEC="$(python - <<'PY'
          import re
          from pathlib import Path

          prefix = "atelier-core @ git+https://github.com/NomadAnget/atelier-core.git@"
          matches = []
          for raw_line in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if line.startswith("atelier-core"):
                  match = re.fullmatch(re.escape(prefix) + r"(v[0-9]+\.[0-9]+\.[0-9]+)", line)
                  if not match:
                      raise SystemExit("requirements.txt must pin atelier-core to a version tag from the official repository")
                  matches.append(prefix + match.group(1))

          if len(matches) != 1:
              raise SystemExit("requirements.txt must contain exactly one atelier-core version pin")
          print(matches[0])
          PY
          )"
          uv pip install --python .venv/bin/python "$KERNEL_SPEC" ollama "httpx>=0.28.1,<1"

      - name: Run the kernel constitution scan (warning only)
        id: discipline
        run: |
          report_file="$RUNNER_TEMP/kernel-discipline.log"
          if .venv/bin/python -m atelier_core.discipline src >"$report_file" 2>&1; then
            scan_result=success
          else
            scan_result=warning
          fi
          python - "$report_file" "$scan_result" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          result = sys.argv[2]
          if result == "warning":
              lines = raw.splitlines()
              relevant = [
                  line for line in lines
                  if re.search(r"\[(?:M\d+|CORE/Discipline)\]|条违规|violation|Violation|Traceback", line)
              ]
              report = "\n".join((relevant or lines[-40:])[-30:])
              if not report:
                  report = "宪法扫描返回非零状态，但没有输出诊断信息。"
              if len(report) > 12000:
                  report = report[:11980] + "\n……（报告已截断）"
          else:
              report = "未发现机器宪法违规。"

          encoded = base64.b64encode(report.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={result}\n")
              output.write(f"report_b64={encoded}\n")
          PY
          cat "$report_file"
          if [ "$scan_result" = warning ]; then
            echo "::warning title=Kernel discipline findings::The constitution findings are shown in the kernel-check details on the PR."
          else
            echo "Kernel constitution scan passed."
          fi

      - name: Run the kernel assembly self-check
        run: >-
          .venv/bin/python -c
          'import asyncio; from atelier_core.boot.assembly import self_test; asyncio.run(self_test("src"))'

  publish-check:
    name: publish-kernel-check
    needs: [kernel-validation, reconcile-marker]
    if: always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Publish kernel-check for the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KERNEL_RESULT: ${{ needs.kernel-validation.result }}
          RECONCILE_SKIP_FULL: ${{ needs.reconcile-marker.outputs.skip_full }}
          DISCIPLINE_RESULT: ${{ needs.kernel-validation.outputs.discipline_result }}
          DISCIPLINE_REPORT_B64: ${{ needs.kernel-validation.outputs.discipline_report_b64 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          kernel_result = os.environ["KERNEL_RESULT"]
          reused = os.environ.get("RECONCILE_SKIP_FULL") == "true"
          conclusion = "success" if kernel_result == "success" or reused else "failure"
          discipline_result = os.environ.get("DISCIPLINE_RESULT", "")
          report_b64 = os.environ.get("DISCIPLINE_REPORT_B64", "")
          report = base64.b64decode(report_b64).decode("utf-8") if report_b64 else ""

          if reused:
              summary = "**内核检查通过（复用已验证结果）。** 工作流签名的 gitlink 核对确认仅子模块提交 SHA 改变，子模块文件树与此前完整检查一致。\n\n"
          elif kernel_result == "success":
              summary = "**内核检查通过。**\n\n"
          else:
              summary = "**内核检查失败。** 请展开 Actions 中的 `kernel-validation` 作业查看失败步骤。\n\n"
          if reused:
              pass
          elif discipline_result == "warning":
              summary += "**宪法检查发现告警（当前策略下不阻断合并）：**\n\n" + report
          elif discipline_result == "success":
              summary += "**宪法检查通过：** 未发现机器可检查的违规。"
          else:
              summary += "宪法扫描未能完成；请查看 Actions 日志。"

          payload = {
              "name": "kernel-check",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {"title": "Kernel validation", "summary": summary},
          }
          Path(os.environ["RUNNER_TEMP"], "kernel-check.json").write_text(
              json.dumps(payload, ensure_ascii=False), encoding="utf-8"
          )
          comment_body = (
              "<!-- atelier-kernel-check-summary -->\n"
              "## Atelier 内核检查\n\n"
              + summary
              + "\n\n[查看完整 Actions 日志]("
              + os.environ["RUN_URL"]
              + ")"
          )
          Path(os.environ["RUNNER_TEMP"], "pr-comment.json").write_text(
              json.dumps({"body": comment_body}, ensure_ascii=False), encoding="utf-8"
          )
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/kernel-check.json"
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- atelier-kernel-check-summary -->"))) | .id' | tail -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/pr-comment.json" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/pr-comment.json" >/dev/null
          fi

  promote-submodule:
    name: merge-child-and-variant
    needs: [kernel-validation, reconcile-marker, publish-check]
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      (needs.kernel-validation.result == 'success' || needs.reconcile-marker.outputs.skip_full == 'true') &&
      needs.publish-check.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.body, '<!-- atelier-submodule-pr ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - name: Merge the checked child PR, reconcile its gitlink, and merge the variant PR
        env:
          ATELIER_CI_TOKEN: ${{ secrets.ATELIER_CI_TOKEN || secrets.GH_SYNC_TOKEN }}
          ATELIER_RELAY_MODE: finalize
        run: python .github/scripts/submodule_pr_relay.py

  auto-merge:
    name: auto-merge
    needs: [kernel-validation, publish-check]
    if: needs.kernel-validation.result == 'success' && needs.publish-check.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && !contains(github.event.pull_request.body, '<!-- atelier-submodule-pr ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable merge auto-merge for the checked pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --auto
          --merge
          --delete-branch
          --match-head-commit "$HEAD_SHA"
